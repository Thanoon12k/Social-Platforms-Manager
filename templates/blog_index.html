{% extends "blog_base.html" %}{% block body %}
{% for e in entries %}<article>
  <h2><a href="/blog/{{ e.slug }}">{{ e.title }}</a></h2>
  <div class="meta">{{ fmt(e.at) }}</div>
  {% if e.kind == 'image' and e.media %}<a href="/blog/{{ e.slug }}"><img src="{{ e.media }}" alt="" loading="lazy"></a>{% endif %}
  <p>{{ e.summary }}{% if e.summary|length >= 220 %}… <a href="/blog/{{ e.slug }}">اقرأ أكثر</a>{% endif %}</p>
</article>{% else %}<p style="color:var(--muted);padding:32px 0">ما كو مقالات بعد.</p>{% endfor %}
{% endblock %}
