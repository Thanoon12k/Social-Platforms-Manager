<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}مدير المنصات{% endblock %}</title>
<meta name="theme-color" content="#ff6b3d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#12101a;--panel:#1f1c2b;--panel2:#282437;--line:rgba(255,255,255,.09);--text:#f3efe6;--muted:#a7a1b6;--accent:#ff6b3d;--good:#3ddc97;--warn:#fbbf24;--bad:#ff6b81;--shadow:rgba(0,0,0,.55);--radius:18px;--sans:"Tajawal",system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3ede2;--panel:#fffaf1;--panel2:#f1e9da;--line:rgba(40,30,10,.12);--text:#221d14;--muted:#6d6556;--shadow:rgba(60,40,10,.22);color-scheme:light}}
:root[data-theme="light"]{--bg:#f3ede2;--panel:#fffaf1;--panel2:#f1e9da;--line:rgba(40,30,10,.12);--text:#221d14;--muted:#6d6556;--shadow:rgba(60,40,10,.22);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--text);line-height:1.6;overflow-x:hidden;
background:radial-gradient(1200px 600px at 15% -10%,rgba(255,107,61,.14),transparent 60%),radial-gradient(900px 500px at 110% 30%,rgba(124,58,237,.12),transparent 60%),var(--bg)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{font-weight:800;line-height:1.25}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
.top{max-width:1200px;margin:0 auto;padding:18px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:var(--text)}.brand:hover{text-decoration:none}
.brand b{font-size:24px}.brand small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.brand-mark{font-size:34px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav a{padding:8px 12px;border-radius:10px;color:var(--text);border:1px solid transparent}nav a:hover{text-decoration:none;border-color:var(--line)}
nav a.on{background:var(--panel);border-color:var(--line)}
main{max-width:1200px;margin:0 auto;padding:12px 16px 48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 22px 40px -26px var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.stat b{display:block;font-size:28px;font-weight:800}.stat span{color:var(--muted);font-size:13px}
.mute{color:var(--muted);font-size:.9em}
input,select,textarea{font:inherit;color:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto}
button,.btn{font:inherit;cursor:pointer;display:inline-block;white-space:nowrap;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;
border:1px solid transparent;color:#1a0e05;background:linear-gradient(135deg,#ff6b3d,#ff9a3c);box-shadow:3px 3px 0 #7a2a12;transition:transform .15s}
button:hover,.btn:hover{transform:translateY(-1px);text-decoration:none}button:active,.btn:active{transform:translateY(1px)}
.btn.ghost,button.ghost{background:var(--panel2);color:var(--text);border-color:var(--line);box-shadow:none}
button.danger{background:transparent;color:var(--bad);border-color:rgba(255,107,129,.4);box-shadow:none}
.icon-btn{width:40px;height:40px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);box-shadow:none;font-size:18px}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{color:var(--muted);font-size:13px;font-weight:500}
.scroll{overflow-x:auto}
.flash{background:rgba(255,107,61,.12);border:1px solid rgba(255,107,61,.35);padding:10px 14px;border-radius:12px;margin-bottom:14px}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.chip input{margin:0}
.ok{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.plat{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.plat .ico{font-size:24px}.plat small{display:block;color:var(--muted);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;margin-inline-start:auto}.dot.on{background:var(--good)}
code{background:var(--panel2);padding:2px 6px;border-radius:6px;font-size:12px;direction:ltr;unicode-bidi:embed;word-break:break-all}
details summary{cursor:pointer;font-weight:700}
.preview{white-space:pre-wrap;word-break:break-word}
img.thumb,video.thumb{max-width:100%;max-height:280px;border-radius:12px;display:block}
</style></head><body>
<header class="top"><a class="brand" href="/"><span class="brand-mark">🛰️</span><div><b>مدير المنصات</b><small>منشور واحد، ينتشر بكل مكان</small></div></a>
<nav>{% if session.admin %}
<a href="/" class="{{ 'on' if request.path == '/' }}">الرئيسية</a>
<a href="/accounts" class="{{ 'on' if request.path.startswith('/accounts') }}">ربط المنصات</a>
<a href="/log" class="{{ 'on' if request.path.startswith('/log') }}">السجل</a>
<a href="/blog" target="_blank">المدونة ↗</a>
<form method="post" action="/logout" style="margin:0"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost">خروج</button></form>
{% endif %}<button class="icon-btn" id="themeBtn" title="تبديل الثيم" aria-label="تبديل الثيم">◐</button></nav></header>
<main>{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}{% block body %}{% endblock %}</main>
<script>document.getElementById("themeBtn").onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches,t=dark?"light":"dark";r.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}}</script>
</body></html>
