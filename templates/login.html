{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:420px;margin:40px auto">
<h2>{{ "اختار كلمة سر للداشبورد" if first else "دخول" }}</h2>
{% if first %}<p class="mute">أول زيارة: الكلمة اللي تكتبها هسه تصير كلمة السر (8 أحرف أو أكثر).</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>كلمة السر</label><input type="password" name="password" autofocus required minlength="{{ 8 if first else 1 }}">
<p><button>{{ "احفظ وادخل" if first else "دخول" }}</button></p></form></div>
{% endblock %}
