<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ blog.title or 'المدونة' }}{% endblock %}</title>
<meta name="description" content="{% block desc %}{{ blog.about or '' }}{% endblock %}">
<link rel="alternate" type="application/rss+xml" title="{{ blog.title or 'المدونة' }}" href="/blog/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f2;--panel:#fff;--line:rgba(40,30,10,.1);--text:#221d14;--muted:#6d6556;--accent:#e2552a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12101a;--panel:#1f1c2b;--line:rgba(255,255,255,.09);--text:#f3efe6;--muted:#a7a1b6;--accent:#ff6b3d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.8 "Tajawal",system-ui,sans-serif}
a{color:var(--accent)}header,main,footer{max-width:760px;margin:0 auto;padding:0 16px}
header{padding-top:32px;padding-bottom:8px;border-bottom:1px solid var(--line)}header a{color:inherit;text-decoration:none}
header h1{margin:0;font-size:30px}header p{margin:4px 0 16px;color:var(--muted)}
article{padding:24px 0;border-bottom:1px solid var(--line)}article h2{margin:0 0 6px;font-size:24px;line-height:1.35}article h2 a{color:inherit;text-decoration:none}
.meta{color:var(--muted);font-size:14px}.tags span{display:inline-block;margin:4px 0 0 6px;font-size:13px;color:var(--muted)}
img,video{max-width:100%;border-radius:14px;display:block;margin:16px 0}audio{width:100%;margin:16px 0}
.body p{margin:0 0 1em;word-break:break-word}footer{padding:32px 16px;color:var(--muted);font-size:14px}
</style></head><body>
<header><a href="/blog"><h1>{{ blog.title or 'المدونة' }}</h1></a><p>{{ blog.about or '' }}</p></header>
<main>{% block body %}{% endblock %}</main>
<footer><a href="/blog/feed.xml">RSS</a></footer></body></html>
